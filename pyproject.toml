[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hellowork-mcp"
version = "1.0.0"
description = "Serveur MCP non officiel pour rechercher, analyser et suivre des offres d'emploi Hellowork depuis un agent IA."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Hellowork MCP contributors" }]
keywords = ["mcp", "model-context-protocol", "hellowork", "job-search", "playwright", "ai-agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp>=2.3,<3",
    "playwright>=1.48",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
hellowork-mcp = "hellowork_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/ATSU-ADJOTO007/hellowork-mcp"
Issues = "https://github.com/ATSU-ADJOTO007/hellowork-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hellowork_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: tests qui contactent le vrai site Hellowork (désactivés par défaut, activer avec HELLOWORK_LIVE_TESTS=1)",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
