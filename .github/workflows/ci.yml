name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Contrôles rédactionnels et fichiers sensibles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tirets cadratins et demi-cadratins
        run: python scripts/check_dashes.py
      - name: Fichiers sensibles suivis par Git
        run: python scripts/check_sensitive_files.py

  tests:
    name: Tests ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check src tests scripts
      - name: Compilation et imports
        run: |
          python -m compileall -q src scripts
          python -c "import hellowork_mcp.server as s; print(s.mcp.name)"
      - name: Tests
        run: python -m pytest -q
      - name: Commande hellowork-mcp
        run: hellowork-mcp --version
